name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Export native JavaScript bundles
        run: npm exec -w @fieldwork/mobile -- expo export --platform all --output-dir dist
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
