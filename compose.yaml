services:
  fieldwork:
    build: .
    ports:
      - '${PORT:-3001}:3001'
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - fieldwork-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  fieldwork-data:
