appId: host.exp.exponent
name: Android named icon controls and photo draft
tags:
  - android
  - journal
---
# Continue after journal-sign-in.android.yaml on the dedicated synthetic fixture.
- extendedWaitUntil:
    visible: My assignments
    timeout: 15000
- assertVisible: My assignments
- takeScreenshot: icon-native-assignments
- longPressOn:
    text: Sync now
    point: 2%,98%
- takeScreenshot: icon-native-hint
- tapOn:
    text: Sync now
    point: 2%,98%
- tapOn: 'Outbox \(0\)'
- assertVisible: Everything is up to date
- tapOn: 'Assignments \(3\)'
- scrollUntilVisible:
    element: 'Open FW-001: Morning safety walkthrough'
    centerElement: true
- tapOn: 'Open FW-001: Morning safety walkthrough'
- assertVisible: Back to assignments
- takeScreenshot: icon-native-inspection
- tapOn: Back to assignments
- scrollUntilVisible:
    element: 'Open FW-001: Morning safety walkthrough'
    centerElement: true
- tapOn: 'Open FW-001: Morning safety walkthrough'
- scrollUntilVisible:
    element: 'Access route is clear and secure: pass'
    centerElement: true
- tapOn: 'Access route is clear and secure: pass'
- assertVisible:
    text: 'Access route is clear and secure: pass'
    checked: true
- takeScreenshot: icon-native-checklist
- scrollUntilVisible:
    element:
      id: inspection-summary
    centerElement: true
- tapOn:
    id: inspection-summary
