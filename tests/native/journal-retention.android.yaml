appId: host.exp.exponent
name: Android journal draft survives restart
tags:
  - android
  - journal
---
- launchApp
- extendedWaitUntil:
    visible: Development servers
    timeout: 15000
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible: My assignments
    timeout: 15000
- tapOn: 'Open FW-003: Weekly equipment inspection'
- scrollUntilVisible:
    element: 'Access route is clear and secure: pass'
    centerElement: true
- assertVisible:
    text: 'Access route is clear and secure: pass'
    checked: true
- scrollUntilVisible:
    element:
      id: inspection-summary
    centerElement: true
- assertVisible:
    id: inspection-summary
    text: Synthetic Android journal draft retained after restart.
- scrollUntilVisible:
    element: 'Equipment has no visible damage or leaks: pass'
    direction: UP
    centerElement: true
- tapOn: 'Equipment has no visible damage or leaks: pass'
- scrollUntilVisible:
    element: 'Safety signage is present and readable: pass'
    centerElement: true
- tapOn: 'Safety signage is present and readable: pass'
- scrollUntilVisible:
    element: 'Work area is clean and free of hazards: pass'
    centerElement: true
- tapOn: 'Work area is clean and free of hazards: pass'
- scrollUntilVisible:
    element: Inspection checklist
    direction: UP
- assertVisible: '4 of 4 checks recorded.*Draft saved on this device'
