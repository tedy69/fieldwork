appId: host.exp.Exponent
name: Restore and queue an inspection offline on iOS
---
- stopApp
- launchApp
- openLink: ${METRO_URL}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: My assignments
    timeout: 30000
- scrollUntilVisible:
    element: ${ORDER_NAME}
    centerElement: true
- tapOn: ${ORDER_NAME}
- scrollUntilVisible:
    element:
      id: inspection-summary
    centerElement: true
- assertVisible:
    id: inspection-summary
    text: ${SUMMARY}
- scrollUntilVisible:
    element: Save and sync inspection
    centerElement: true
- tapOn: Save and sync inspection
- extendedWaitUntil:
    visible: Report saved
    timeout: 15000
- tapOn: OK
- scrollUntilVisible:
    element: Back to assignments
    direction: UP
- tapOn: Back to assignments
- scrollUntilVisible:
    element:
      id: open-queued-reports
    direction: UP
    centerElement: true
- assertVisible:
    id: open-queued-reports
    text: Open outbox. 1 report queued
- tapOn:
    id: open-queued-reports
- assertVisible: ${SUMMARY}
- stopApp
- launchApp
- openLink: ${METRO_URL}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: My assignments
    timeout: 30000
- tapOn: 'Outbox \(1\)'
- assertVisible: ${SUMMARY}
