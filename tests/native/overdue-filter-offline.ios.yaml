appId: host.exp.Exponent
name: Find assignments due today or overdue while offline
---
- scrollUntilVisible:
    element: Sync now
    direction: UP
- tapOn:
    text: Sync now
    point: 10%,50%
- extendedWaitUntil:
    visible: Could not sync. You can still use saved assignments. Try again when connected.
    timeout: 15000
- scrollUntilVisible:
    element: Filter assignments
    direction: UP
- tapOn: Filter assignments
- tapOn:
    text: Due today
    index: 0
- scrollUntilVisible:
    element: Due today · 1 shown
- assertVisible: Due today · 1 shown
- scrollUntilVisible:
    element: ${TODAY}
    centerElement: true
- assertVisible: ${TODAY}
- scrollUntilVisible:
    element:
      text: Overdue
      index: 0
    direction: UP
- tapOn:
    text: Overdue
    index: 0
- scrollUntilVisible:
    element: Overdue · 1 shown
- assertVisible: Overdue · 1 shown
- scrollUntilVisible:
    element: ${LATE}
    centerElement: true
- tapOn: ${LATE}
- assertVisible: Overdue QA past
- assertVisible: Jan 1, 2026 · routine
- tapOn: Back to assignments
- scrollUntilVisible:
    element: Overdue · 1 shown
    direction: UP
- assertVisible:
    id: assignment-search
    text: Overdue QA
- scrollUntilVisible:
    element: Bahasa Indonesia
    direction: UP
- tapOn: Bahasa Indonesia
- scrollUntilVisible:
    element: Sinkronisasi gagal. Tugas tersimpan tetap bisa dibuka. Sambungkan ke internet, lalu coba lagi.
- assertVisible: Sinkronisasi gagal. Tugas tersimpan tetap bisa dibuka. Sambungkan ke internet, lalu coba lagi.
- scrollUntilVisible:
    element: Lewat tenggat · 1 ditampilkan
- assertVisible: Lewat tenggat · 1 ditampilkan
- scrollUntilVisible:
    element: ${LATE_ID}
    centerElement: true
- tapOn: ${LATE_ID}
- assertVisible: 1 Jan 2026 · rutin
- tapOn: Kembali ke daftar tugas
