appId: host.exp.Exponent
name: Find assignments due today or overdue while offline
---
- scrollUntilVisible:
    element: Filter assignments
    direction: UP
- tapOn: Filter assignments
- tapOn:
    text: Due today
    index: 0
- scrollUntilVisible:
    element: Due today · 1 shown
- assertVisible: Due today · 1 shown
- scrollUntilVisible:
    element: ${TODAY}
    centerElement: true
- assertVisible: ${TODAY}
- scrollUntilVisible:
    element:
      text: Overdue
      index: 0
    direction: UP
- tapOn:
    text: Overdue
    index: 0
- scrollUntilVisible:
    element: Overdue · 1 shown
- assertVisible: Overdue · 1 shown
- scrollUntilVisible:
    element: ${LATE}
    centerElement: true
- tapOn: ${LATE}
- assertVisible: Overdue QA past
- tapOn: Back to assignments
- scrollUntilVisible:
    element: Overdue · 1 shown
    direction: UP
- assertVisible:
    id: assignment-search
    text: Overdue QA
- scrollUntilVisible:
    element: Bahasa Indonesia
    direction: UP
- tapOn: Bahasa Indonesia
- scrollUntilVisible:
    element: Lewat tenggat · 1 ditampilkan
- assertVisible: Lewat tenggat · 1 ditampilkan
