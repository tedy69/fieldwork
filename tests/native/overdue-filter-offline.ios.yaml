appId: host.exp.Exponent
name: Find assignments by due date while offline
---
- scrollUntilVisible:
    element: Sync now
    direction: UP
- tapOn:
    text: Sync now
    point: 10%,50%
- extendedWaitUntil:
    visible: Saved assignments are still available. Reconnect to sync.
    timeout: 15000
- scrollUntilVisible:
    element: Filter assignments
    direction: UP
- tapOn: Filter assignments
- tapOn:
    text: '^Due today$'
    index: 0
- scrollUntilVisible:
    element: Due today · 1 shown
- assertVisible: Due today · 1 shown
- scrollUntilVisible:
    element: ${TODAY}
    centerElement: true
- assertVisible: ${TODAY}
- scrollUntilVisible:
    element:
      text: '^Next 7 days$'
      index: 0
    direction: UP
    centerElement: true
- tapOn:
    text: '^Next 7 days$'
    index: 0
- scrollUntilVisible:
    element: Next 7 days · 2 shown
- assertVisible: Next 7 days · 2 shown
- scrollUntilVisible:
    element: ${EDGE}
    centerElement: true
- assertVisible: ${EDGE}
- scrollUntilVisible:
    element:
      text: '^Overdue$'
      index: 0
    direction: UP
    centerElement: true
- tapOn:
    text: '^Overdue$'
    index: 0
- scrollUntilVisible:
    element: Overdue · 1 shown
- assertVisible: Overdue · 1 shown
- scrollUntilVisible:
    element: ${LATE}
    centerElement: true
- tapOn: ${LATE}
- assertVisible: Overdue QA past
- assertVisible: Jan 1, 2026 · routine
- tapOn: Back to assignments
- scrollUntilVisible:
    element: Overdue · 1 shown
    direction: UP
- assertVisible:
    id: assignment-search
    text: Overdue QA
- scrollUntilVisible:
    element: Bahasa Indonesia
    direction: UP
- tapOn: Bahasa Indonesia
- scrollUntilVisible:
    element: Tugas tersimpan tetap bisa dibuka. Sambungkan untuk sinkronisasi.
- assertVisible: Tugas tersimpan tetap bisa dibuka. Sambungkan untuk sinkronisasi.
- scrollUntilVisible:
    element: Lewat tenggat · 1 ditampilkan
- assertVisible: Lewat tenggat · 1 ditampilkan
- tapOn: Hapus filter tugas
- assertNotVisible: Lewat tenggat · 1 ditampilkan
- scrollUntilVisible:
    element:
      id: assignment-search
    direction: UP
- assertVisible:
    id: assignment-search
    text: Overdue QA
- scrollUntilVisible:
    element: ${FUTURE_ID}
- assertVisible: ${FUTURE_ID}
- scrollUntilVisible:
    element: Saring tugas
    direction: UP
- tapOn: Saring tugas
- tapOn:
    text: '^Lewat tenggat$'
    index: 0
- tapOn: Saring tugas
- assertVisible: Lewat tenggat · 1 ditampilkan
- scrollUntilVisible:
    element: ${LATE_ID}
    centerElement: true
- tapOn: ${LATE_ID}
- assertVisible: 1 Jan 2026 · rutin
- tapOn: Kembali ke daftar tugas
