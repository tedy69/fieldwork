appId: host.exp.exponent
name: Indonesian sign-in on Android
tags:
  - android
  - journal
---
# Start on the English sign-in screen with the synthetic fixture.
- assertVisible: Sign in to Fieldwork
- tapOn:
    text: Bahasa Indonesia
    point: 25%,50%
- assertVisible: Masuk ke Fieldwork
- tapOn: Ubah server
- assertVisible: Alamat server
- tapOn: Sembunyikan pengaturan server
- tapOn:
    id: login-email
- inputText: worker@fieldwork.local
- tapOn: Selesai mengedit
- tapOn:
    id: login-password
- inputText: wrong-demo-password
- tapOn: Selesai mengedit
- tapOn: Tampilkan kata sandi
- assertVisible:
    id: login-password
    text: wrong-demo-password
- tapOn: Sembunyikan kata sandi
- tapOn: ^Masuk$
- extendedWaitUntil:
    visible: Email atau kata sandi salah.
    timeout: 15000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Development servers
    timeout: 15000
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible: Masuk ke Fieldwork
    timeout: 30000
- tapOn:
    text: English
    point: 25%,50%
- assertVisible: Sign in to Fieldwork
